name: Upstream Version Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          echo "matrix=$(jq -c '.releases' releases.json)" >> $GITHUB_OUTPUT

  check:
    needs: load
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: ${{ fromJson(needs.load.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Check digest for ${{ matrix.release.name }}
        id: digest-check
        run: |
          TAG="${{ matrix.release.kolla_tag }}"
          DIGEST_FILE="digests/${TAG}.txt"

          LATEST=$(curl -s \
            "https://quay.io/api/v1/repository/openstack.kolla/horizon/tag/${TAG}?onlyActiveTags=true" \
            | jq -r '.tags[0].manifest_digest // ""')

          STORED=""
          if [ -f "$DIGEST_FILE" ]; then STORED=$(cat "$DIGEST_FILE"); fi

          echo "latest=$LATEST"             >> $GITHUB_OUTPUT
          echo "stored=$STORED"             >> $GITHUB_OUTPUT
          echo "tag=$TAG"                   >> $GITHUB_OUTPUT
          echo "digest_file=$DIGEST_FILE"   >> $GITHUB_OUTPUT

          if [ -n "$LATEST" ] && [ "$LATEST" != "$STORED" ]; then
            echo "changed=true"  >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update stored digest
        if: steps.digest-check.outputs.changed == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.digest-check.outputs.latest }}" \
            > "${{ steps.digest-check.outputs.digest_file }}"

      - name: Trigger build for ${{ matrix.release.name }}
        if: steps.digest-check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: { release: '${{ matrix.release.kolla_tag }}' }
            });
            console.log('Build triggered for ${{ matrix.release.kolla_tag }}');

  commit-digests:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit updated digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --staged --quiet \
            || git commit -m "chore: update upstream digests [skip ci]"
          git push
