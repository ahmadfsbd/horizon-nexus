name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Step 1: read releases.json and emit the matrix ──────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix from releases.json
        id: set-matrix
        run: |
          # Convert releases array to a JSON matrix object GitHub Actions understands
          MATRIX=$(jq -c '{ include: [ .releases[] | { name: .name, kolla_tag: .kolla_tag } ] }' releases.json)
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  # ── Step 2: build + push one image per release ───────────────────────────
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # keep building other releases if one fails
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build theme css
        run: npm run build:css

      - name: Run smoke checks
        run: npm run test:theme

      - name: Set image tags
        run: |
          KOLLA_TAG="${{ matrix.kolla_tag }}"
          echo "TAG_FLOAT=${KOLLA_TAG}-latest" >> $GITHUB_ENV
          echo "KOLLA_TAG=${KOLLA_TAG}"        >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build \
            --build-arg HORIZON_TAG=${KOLLA_TAG} \
            -t ahmadfsbd/horizon-nexus:${TAG_FLOAT} \
            .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image
        run: |
          docker push ahmadfsbd/horizon-nexus:${TAG_FLOAT}

      - name: Deploy to VM
        if: ${{ env.DEPLOY_HOST != '' && matrix.name == 'master' }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              ${DEPLOY_USER}@${DEPLOY_HOST} \
              "sudo docker pull ahmadfsbd/horizon-nexus:${TAG_FLOAT} && \
               sudo docker stop horizon && \
               sudo docker rm horizon && \
               sudo docker run -d --name horizon --network host \
                 -e KOLLA_CONFIG_STRATEGY=COPY_ALWAYS \
                 -v /etc/kolla/horizon/:/var/lib/kolla/config_files/:ro \
                 -v /etc/localtime:/etc/localtime:ro \
                 -v /var/log/kolla/horizon:/var/log/kolla/horizon \
                 ahmadfsbd/horizon-nexus:${TAG_FLOAT}"
          rm -f /tmp/deploy_key
