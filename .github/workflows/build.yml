name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Specific release name to build (empty = all)'
        required: false
        default: ''
  workflow_call:
    inputs:
      release:
        type: string
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release matrix
        id: set-matrix
        run: |
          if [ -n "${{ inputs.release }}" ]; then
            MATRIX=$(jq -c \
              --arg r "${{ inputs.release }}" \
              '[.releases[] | select(.name == $r)]' \
              releases.json)
          else
            MATRIX=$(jq -c '.releases' releases.json)
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      matrix:
        release: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        run: |
          UI_VERSION=$(cat VERSION)
          echo "PINNED_TAG=${{ matrix.release.name }}-${UI_VERSION}" >> $GITHUB_ENV
          echo "FLOAT_TAG=${{ matrix.release.name }}-latest"         >> $GITHUB_ENV
          echo "KOLLA_TAG=${{ matrix.release.kolla_tag }}"           >> $GITHUB_ENV

      - name: Compile SCSS
        run: |
          npm install -g sass
          sass overlay/themes/nexus/static/scss/nexus.scss \
               overlay/themes/nexus/static/css/nexus.css \
               --no-source-map

      - name: Build image
        run: |
          docker build \
            --build-arg HORIZON_TAG=${{ env.KOLLA_TAG }} \
            -t ahmadfsbd/horizon-nexus:${{ env.PINNED_TAG }} \
            -t ahmadfsbd/horizon-nexus:${{ env.FLOAT_TAG }} \
            .

      - name: Smoke test
        run: |
          # Run with a dummy entrypoint so the container stays up without
          # needing a live Keystone/database (collectstatic already ran at build time)
          docker run -d --name test-${{ matrix.release.name }} \
            --entrypoint sleep \
            ahmadfsbd/horizon-nexus:${{ env.PINNED_TAG }} infinity

          # 1. Verify nexus-vars.css was baked in by collectstatic
          docker exec test-${{ matrix.release.name }} \
            grep -q "\-\-nexus-accent" \
            /usr/share/openstack-dashboard/static/themes/nexus/css/nexus-vars.css \
            || (echo "FAIL: nexus-vars.css missing or empty for ${{ matrix.release.name }}" \
                && docker stop test-${{ matrix.release.name }} && exit 1)

          # 2. Verify the nexus theme template override is in place
          docker exec test-${{ matrix.release.name }} \
            test -f /usr/share/openstack-dashboard/openstack_dashboard/templates/base.html \
            || (echo "FAIL: base.html template override missing for ${{ matrix.release.name }}" \
                && docker stop test-${{ matrix.release.name }} && exit 1)

          # 3. Verify local_settings.d theme activation is present
          docker exec test-${{ matrix.release.name }} \
            grep -q "DEFAULT_THEME" \
            /etc/openstack-dashboard/local_settings.d/50_nexus_theme.py \
            || (echo "FAIL: 50_nexus_theme.py missing DEFAULT_THEME for ${{ matrix.release.name }}" \
                && docker stop test-${{ matrix.release.name }} && exit 1)

          docker stop test-${{ matrix.release.name }}
          echo "PASS: all smoke checks passed for ${{ matrix.release.name }}"

      - name: Push to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | \
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker push ahmadfsbd/horizon-nexus:${{ env.PINNED_TAG }}
          docker push ahmadfsbd/horizon-nexus:${{ env.FLOAT_TAG }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed: ${{ matrix.release.name }}`,
              body: `The build and push pipeline failed for release **${{ matrix.release.name }}**.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['build-failure']
            });

# ahmadfsbd/horizon-nexus:latest is NOT auto-pushed.
# Promote manually by tagging and pushing a specific pinned image as latest.
