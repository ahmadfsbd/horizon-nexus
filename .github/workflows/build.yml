name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build theme css
        run: npm run build:css

      - name: Run smoke checks
        run: npm run test:theme

      - name: Set tags
        run: |
          UI_VERSION=$(cat VERSION)
          echo "TAG_PIN=master-ubuntu-noble-${UI_VERSION}" >> $GITHUB_ENV
          echo "TAG_FLOAT=master-ubuntu-noble-latest" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build \
            --build-arg HORIZON_TAG=master-ubuntu-noble \
            -t ahmadfsbd/horizon-nexus:${TAG_PIN} \
            -t ahmadfsbd/horizon-nexus:${TAG_FLOAT} \
            .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image
        run: |
          docker push ahmadfsbd/horizon-nexus:${TAG_PIN}
          docker push ahmadfsbd/horizon-nexus:${TAG_FLOAT}

      - name: Deploy to VM
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              ${DEPLOY_USER}@${DEPLOY_HOST} \
              "sudo docker pull ahmadfsbd/horizon-nexus:master-ubuntu-noble-latest && \
               sudo docker stop horizon && \
               sudo docker rm horizon && \
               sudo docker run -d --name horizon --network host \
                 -e KOLLA_CONFIG_STRATEGY=COPY_ALWAYS \
                 -v /etc/kolla/horizon/:/var/lib/kolla/config_files/:ro \
                 -v /etc/localtime:/etc/localtime:ro \
                 -v /var/log/kolla/horizon:/var/log/kolla/horizon \
                 ahmadfsbd/horizon-nexus:master-ubuntu-noble-latest"
          rm -f /tmp/deploy_key
