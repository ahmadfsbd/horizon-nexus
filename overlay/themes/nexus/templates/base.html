{% extends "base.html" %}

{#
  Safe override: only append custom CSS files.
  Do not override layout/header/sidebar blocks.
#}
{% block css %}
  {{ block.super }}
  <link rel="stylesheet" href="{{ STATIC_URL }}themes/nexus/css/nexus.css">
  <link rel="stylesheet" href="{{ STATIC_URL }}themes/nexus/css/nexus-vars.css">
{% endblock %}

{% block js %}
  {{ block.super }}
  <script>
    /* Nexus: patch d3 quota pie charts to render as donuts (innerRadius > 0) */
    (function () {
      function patchPieCharts() {
        if (typeof d3 === 'undefined' || typeof horizon === 'undefined' ||
            typeof horizon.d3_pie_chart_usage === 'undefined') {
          return;
        }
        var OUTER = 45;
        var INNER = 28; /* donut hole size — increase for thinner ring */

        /* Patch create_arc used at init time */
        var _origInit = horizon.d3_pie_chart_usage.init;
        horizon.d3_pie_chart_usage.init = function () {
          /* Temporarily override the global create_arc */
          var _orig = window.create_arc;
          window.create_arc = function () {
            return d3.svg.arc().outerRadius(OUTER).innerRadius(INNER);
          };
          _origInit.apply(this, arguments);
          window.create_arc = _orig;
        };
      }

      /* Run after horizon initialises */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', patchPieCharts);
      } else {
        patchPieCharts();
      }
      /* Also try on horizon ready in case scripts load late */
      window.addEventListener('load', patchPieCharts);
    })();
  </script>
{% endblock %}
