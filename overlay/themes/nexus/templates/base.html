{% extends "base.html" %}

{#
  Safe override: only append custom CSS files.
  Do not override layout/header/sidebar blocks.
#}
{% block css %}
  {{ block.super }}
  <link rel="stylesheet" href="{{ STATIC_URL }}themes/nexus/css/nexus.css">
{% endblock %}

{% block js %}
  {{ block.super }}
  <script>
    /* Nexus: patch d3 quota pie charts to render as donuts (innerRadius > 0) */
    (function () {
      function patchPieCharts() {
        if (typeof d3 === 'undefined' || typeof horizon === 'undefined' ||
            typeof horizon.d3_pie_chart_usage === 'undefined') {
          return;
        }
        var OUTER = 45;
        var INNER = 28; /* donut hole size — increase for thinner ring */

        /* Patch create_arc used at init time */
        var _origInit = horizon.d3_pie_chart_usage.init;
        horizon.d3_pie_chart_usage.init = function () {
          /* Temporarily override the global create_arc */
          var _orig = window.create_arc;
          window.create_arc = function () {
            return d3.svg.arc().outerRadius(OUTER).innerRadius(INNER);
          };
          _origInit.apply(this, arguments);
          window.create_arc = _orig;
        };
      }

      /* Run after horizon initialises */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', patchPieCharts);
      } else {
        patchPieCharts();
      }
      /* Also try on horizon ready in case scripts load late */
      window.addEventListener('load', patchPieCharts);
    })();

    /*
     * Nexus: fix TypeError in Create Image dialog.
     *
     * Root cause: glance.service.js getImages() catches API errors by calling
     * toastService and returning undefined (no fallback return). The controller's
     * onGetImages() then does response.data.items.filter(...) → TypeError because
     * response is undefined.
     *
     * Fix: decorate the glance service via Angular's $provide.decorator so
     * getImages() always resolves with {data:{items:[]}} on failure instead of
     * resolving with undefined.
     */
    (function () {
      function patchGlanceService() {
        if (typeof angular === 'undefined') { return; }
        try {
          angular.module('horizon.app.core.openstack-service-api')
            .config(['$provide', function ($provide) {
              $provide.decorator('horizon.app.core.openstack-service-api.glance',
                ['$delegate', '$q', function ($delegate, $q) {
                  var _orig = $delegate.getImages;
                  $delegate.getImages = function (params) {
                    return _orig.call($delegate, params).then(function (response) {
                      /* If upstream catch swallowed the error, response is
                         undefined — return a safe empty list instead. */
                      if (!response || !response.data) {
                        return { data: { items: [] } };
                      }
                      return response;
                    });
                  };
                  return $delegate;
                }]
              );
            }]);
        } catch (e) {
          /* Angular not ready yet — will be fine, the module exists by load time */
        }
      }
      patchGlanceService();
    })();
  </script>
{% endblock %}
